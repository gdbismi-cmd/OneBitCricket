name: Build Vesuvius wallpaper APK
on:
  push:
    paths: ['VesuviusWallpaper/**', '.github/workflows/build-vesuvius-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: VesuviusWallpaper }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VesuviusWallpaper-apk
          path: VesuviusWallpaper/app/build/outputs/apk/release/*.apk
